<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="Backlot — Production Studio">Backlot — Production Studio</title>
<link rel="stylesheet" href="/ui/board.css">
<link rel="stylesheet" href="/ui/fonts.css">
<link rel="stylesheet" href="/ui/studio.css">
<link rel="stylesheet" href="/ui/i18n.css">
<link rel="stylesheet" href="/ui/account.css">
</head>
<body>
<main class="wrap">
  <header class="slate">
    <div class="clapper" aria-hidden="true"></div>
    <div><a class="wordmark" href="/" data-locale-link aria-label="Project library" data-i18n-aria-label="Project library">Backlot</a><h1 data-i18n="Production Studio">Production Studio</h1></div>
    <div class="spacer"></div><a class="chip" href="/" data-locale-link data-i18n="Project library">Project library</a>
  </header>
  <div class="studio-layout" id="language-panel" role="tabpanel" tabindex="0" aria-labelledby="language-tab-zh">
    <section class="studio-entry" aria-labelledby="brief-heading">
      <h2 id="brief-heading" data-i18n="What would you like to make?">What would you like to make?</h2>
      <p class="studio-hint" data-i18n="Describe the video. Review the proposal and approve each required stage on its board.">Describe the video. Review the proposal and approve each required stage on its board.</p>
      <form id="studio-form">
        <fieldset id="production-inputs" disabled>
          <label for="brief" data-i18n="Video brief">Video brief</label>
          <textarea id="brief" name="brief" rows="5" minlength="2" maxlength="10000" required placeholder="A 30-second explainer about how a lighthouse works" data-i18n-placeholder="A 30-second explainer about how a lighthouse works"></textarea>
          <div class="studio-fields">
            <div><label for="profile" data-i18n="Agent profile">Agent profile</label><select id="profile" name="profile" required></select></div>
            <div><label for="duration" data-i18n="Duration (seconds)">Duration (seconds)</label><input id="duration" name="duration" type="number" min="1" max="600" step="1" value="30" required></div>
            <div><label for="aspect-ratio" data-i18n="Aspect ratio">Aspect ratio</label><select id="aspect-ratio" name="aspect-ratio"><option>16:9</option><option>9:16</option><option>1:1</option></select></div>
            <div><label for="budget" data-i18n="Estimated budget (USD)">Estimated budget (USD)</label><input id="budget" name="budget" type="number" min="0" max="1000000" step="0.01" value="10.00" required></div>
          </div>
          <label class="studio-checkbox" for="narration"><input id="narration" type="checkbox"> <span data-i18n="Include narration">Include narration</span></label>
          <p class="studio-hint" id="profile-info"></p>
          <button id="create-task" class="studio-primary" type="submit" data-i18n="Create video task">Create video task</button>
        </fieldset>
      </form>
      <p id="studio-status" class="studio-status" role="status" aria-live="polite" data-i18n="Loading available profiles…">Loading available profiles…</p>
    </section>
    <section class="studio-tasks" aria-labelledby="tasks-heading">
      <h2 id="tasks-heading" data-i18n="Your tasks">Your tasks</h2>
      <div id="current-task" aria-live="polite"></div>
      <div id="task-list"></div>
    </section>
  </div>
</main>
<script type="module" src="/ui/studio.js"></script>
</body>
</html>
